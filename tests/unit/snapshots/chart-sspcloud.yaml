---
# Source: wikidb/templates/pvc.yaml
# Permanent directory: installed-extension state, search index, logs (KTD5). Content lives in PostgreSQL (KTD4).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wikidb-data
  labels:
    app.kubernetes.io/name: wikidb
    app.kubernetes.io/instance: wikidb
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 10Gi

