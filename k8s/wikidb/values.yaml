# Platform-neutral defaults; values-sspcloud.yaml holds the SSPCloud specifics.
image:
  repository: ghcr.io/paquitopg/wikidb
  # Deploy by digest or revision tag (e.g. "1.0.12"), never a moving tag.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

# 0 stops the wiki without deleting anything, e.g. to fill an empty volume before a restore (restore.md).
# Never more than 1: XWiki is not clustered here and the volume is ReadWriteOnce.
replicas: 1

# PostgreSQL from the Onyxia catalog (CloudNativePG). The operator's "-app" Secret carries the credentials.
postgresql:
  host: ""            # e.g. postgresql-cnpg-123456-rw
  port: "5432"
  secretName: ""      # e.g. postgresql-cnpg-123456-app (keys: dbname, username, password)

# Secret created by hand (never in Git) with keys OIDC_CLIENT_ID, OIDC_SECRET and, for the one-off bootstrap only,
# SUPERADMIN_PASSWORD. Mounted as files under /secrets/app (KTD11).
appSecret: wikidb-app

oidc:
  discoveryUrl: ""    # ProConnect .well-known/openid-configuration of the platform's client
  # Outbound proxy for the ProConnect calls (Nubonyxia only); leave empty for direct access.
  proxyHost: ""
  proxyPort: ""
  userAgent: ""
  nonProxyHosts: "localhost|127.*|*.svc|*.svc.cluster.local"

ingress:
  enabled: true
  className: onyxia
  hostname: ""

# Word and PowerPoint export service (KTD17), routed under /export on the wiki's hostname.
export:
  enabled: true
  image:
    repository: ghcr.io/paquitopg/wikidb-export
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}

persistence:
  size: 10Gi
  storageClassName: ""

resources:
  requests: {cpu: "1", memory: 3Gi}
  limits: {memory: 3Gi}
javaHeap: 2g
