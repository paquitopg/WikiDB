{{- with .Values.imageCredentials }}
{{- if .registry }}
# Registry credentials that the Nubonyxia Deploy job passes with --set (D2).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Release.Name }}-pull
  labels: {{- include "wikidb.labels" $ | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ dict "auths" (dict .registry (dict "username" .username "password" .token "auth" (printf "%s:%s" .username .token | b64enc))) | toJson | b64enc }}
{{- end }}
{{- end }}
