{{- if .Values.appSecrets.enabled }}
# Application secrets that the Nubonyxia Deploy job generates from the runner's /secrets/app (D2).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-app-secrets
  labels: {{- include "wikidb.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range .Values.appSecrets.secrets }}
  {{ .name }}: {{ .valueBase64 | quote }}
  {{- end }}
{{- end }}
