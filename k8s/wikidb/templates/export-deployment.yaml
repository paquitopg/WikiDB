{{- if .Values.export.enabled }}
# Word and PowerPoint export (KTD17): a separate workload, so its failures and updates never touch the wiki pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-export
  labels: {{- include "wikidb.exportLabels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "wikidb.exportLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "wikidb.exportLabels" . | nindent 8 }}
    spec:
      {{- with include "wikidb.imagePullSecrets" . }}{{ . | nindent 6 }}{{ end }}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: export
          image: {{ include "wikidb.exportImage" . }}
          imagePullPolicy: {{ .Values.export.image.pullPolicy }}
          ports:
            - {name: http, containerPort: 8000}
          env:
            # The service holds no credentials: it forwards each reader's own session to the wiki Service.
            - {name: WIKIDB_INTERNAL_URL, value: "http://{{ .Release.Name }}:8080"}
          resources: {{- toYaml .Values.export.resources | nindent 12 }}
          readinessProbe:
            httpGet: {path: /export/healthz, port: http}
            periodSeconds: 15
          livenessProbe:
            httpGet: {path: /export/healthz, port: http}
            periodSeconds: 30
{{- end }}
