[project]
name = "wikidb-tools"
version = "1.0.0"
description = "Operations tooling for the Direction du Budget knowledge wiki: provisioning, HR sync, import, backups"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "openpyxl>=3.1",
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Word and PowerPoint export service (U13, KTD17).
export = ["fastapi>=0.115", "uvicorn>=0.30", "python-docx>=1.1", "python-pptx>=1.0"]

[project.scripts]
wikidb = "wikidb.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["tools"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = ["acceptance: runs against a live dev wiki (needs --base-url)"]
