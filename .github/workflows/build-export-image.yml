# Builds the Word/PowerPoint export service image and pushes it to GHCR (U14, KTD17).
# Separate from the wiki image so each builds only when its own inputs change.
name: Build export image

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "export/**"
      - "tools/wikidb/**"
      - "pyproject.toml"
      - "tests/unit/test_export.py"
      - ".github/workflows/build-export-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/wikidb-export

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Unit tests
        run: |
          pip install -e ".[dev,export]"
          pytest tests/unit

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: export/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:1.0.${{ github.run_number }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.IMAGE) || format('{0}:dev', env.IMAGE) }}
